<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#020617">
  <title>Siirt Evliya Çelebi TMTAL - Orta Alan Pano</title>
  <style>
    :root{--bg:#020617;--fg:#f8fafc;--accent:#f59e0b;--theme:#2563eb}
    *{box-sizing:border-box} html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;font-family:Arial,"Segoe UI",sans-serif;color:var(--fg)}
    #stage{position:relative;width:100%;height:100%;overflow:hidden;background:#000}
    .slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transform:scale(.995);transition:opacity .55s ease,transform .55s ease,visibility .55s;background:var(--bg)}
    .slide.active{opacity:1;visibility:visible;transform:scale(1)}
    #loader{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 30%,#1e3a8a55,transparent 40%),#020617;text-align:center}
    .spinner{width:42px;height:42px;border:5px solid #ffffff22;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    #loader strong{font-size:clamp(20px,3.5vw,38px)} #loader span{color:#94a3b8;font-size:clamp(12px,1.5vw,18px)}
    .news{--news:#2563eb;padding:clamp(18px,3vw,35px) clamp(24px,4vw,48px);background:radial-gradient(circle at 12% 35%,color-mix(in srgb,var(--news) 32%,transparent),transparent 34%),linear-gradient(135deg,#111827,#020617)}
    .news-grid{width:100%;display:grid;grid-template-columns:clamp(90px,14vw,145px) minmax(0,1fr);gap:clamp(20px,3vw,38px);align-items:center}
    .news-icon{width:clamp(90px,14vw,145px);aspect-ratio:1;display:grid;place-items:center;border-radius:28%;background:var(--news);border:2px solid #ffffff44;box-shadow:0 20px 55px color-mix(in srgb,var(--news) 38%,transparent);font-size:clamp(44px,7vw,78px);font-weight:900}
    .badge{display:inline-block;margin-bottom:10px;padding:6px 18px;border-radius:999px;background:var(--news);font-size:clamp(11px,1.3vw,16px);font-weight:900;letter-spacing:2px}
    .news h1{margin:0 0 12px;font-size:clamp(28px,4.3vw,54px);line-height:1.04;overflow-wrap:anywhere}.news p{margin:0;color:#dbeafe;font-size:clamp(17px,2.25vw,29px);line-height:1.34;overflow-wrap:anywhere;white-space:pre-line}
    .exam{padding:clamp(8px,1.4vw,15px);background:linear-gradient(135deg,#0f172a,#111827)}
    .exam-box{width:100%;height:100%;display:flex;flex-direction:column;min-height:0}.exam-title{flex:none;margin-bottom:8px;padding:9px 12px;border-radius:11px;background:var(--theme);font-size:clamp(20px,2.7vw,34px);font-weight:900;text-align:center;box-shadow:0 8px 22px #0005}
    .exam-grid{flex:1;min-height:0;display:grid;gap:8px}.day{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;border-radius:10px;background:#fff;color:#172033}.day-head{flex:none;padding:7px;text-align:center;background:#f1f5f9;border-bottom:4px solid var(--theme)}.date{color:var(--theme);font-size:clamp(15px,1.8vw,23px);font-weight:900}.dayname{margin-top:2px;color:#475569;font-size:clamp(11px,1.15vw,15px);font-weight:700}
    .lessons{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:7px}.lesson{flex:1;min-height:34px;max-height:62px;display:flex;overflow:hidden;border:1px solid #e2e8f0;border-radius:7px;background:#f8fafc}.hour{width:55px;flex:0 0 55px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--theme);color:#fff;font-size:clamp(16px,1.7vw,22px);font-weight:900;line-height:1}.hour small{margin-top:2px;font-size:8px}.subject{flex:1;min-width:0;display:flex;align-items:center;padding:5px 8px;font-size:clamp(11px,1.25vw,16px);line-height:1.08;font-weight:800;overflow-wrap:anywhere}
    .media{background:#000}.media img,.media video,.media iframe{display:block;width:100%;height:100%;border:0;background:#000;object-fit:contain}
    .custom{display:block;overflow:hidden;background:#000}.custom-inner{width:100%;height:100%;overflow:hidden}
    .message{width:min(680px,90%);padding:30px;border:1px solid #ffffff22;border-radius:18px;background:#0f172ae8;text-align:center}.message strong{display:block;font-size:clamp(22px,3vw,36px)}.message span{display:block;margin-top:10px;color:#94a3b8;font-size:clamp(14px,1.7vw,20px)}
    #progressTrack{position:fixed;left:0;bottom:0;z-index:90;width:100%;height:4px;background:#ffffff1c}#progress{height:100%;width:0;background:linear-gradient(90deg,#f59e0b,#fde68a)}
    #dot{position:fixed;right:7px;bottom:8px;z-index:91;width:7px;height:7px;border-radius:50%;background:#f59e0b;opacity:.65}#dot.online{background:#22c55e}#dot.offline{background:#ef4444}
    @media(max-width:700px),(max-height:430px){.news{padding:15px 22px}.news-grid{grid-template-columns:80px minmax(0,1fr);gap:18px}.news-icon{width:80px;font-size:40px}.badge{margin-bottom:7px;padding:5px 13px}.news h1{margin-bottom:8px}.exam-title{padding:7px 10px;margin-bottom:6px}.exam-grid{gap:6px}.day-head{padding:5px}.lessons{padding:5px;gap:4px}.hour{width:48px;flex-basis:48px}}
  </style>
</head>
<body>
  <div id="loader"><strong>SİSTEM YÜKLENİYOR</strong><div class="spinner"></div><span>Siirt Evliya Çelebi TMTAL Dijital Panosu</span></div>
  <main id="stage"></main>
  <div id="progressTrack"><div id="progress"></div></div>
  <div id="dot" title="Bağlantı durumu"></div>
<script>
'use strict';
/* GOOGLE SHEETS YAYIN LİNKLERİ */
const CSV_MEDYA="https://docs.google.com/spreadsheets/d/e/2PACX-1vRZVHePaoezGmveXoNkXIzZnrWOPyj7CWDQMIpZFkiySklVPPWh1WpGO9QGYPQ86868taRJFfADH8Ow/pub?gid=167087393&single=true&output=csv";
const CSV_SINAVLAR="https://docs.google.com/spreadsheets/d/e/2PACX-1vRZVHePaoezGmveXoNkXIzZnrWOPyj7CWDQMIpZFkiySklVPPWh1WpGO9QGYPQ86868taRJFfADH8Ow/pub?gid=501842148&single=true&output=csv";
const CSV_AYARLAR="https://docs.google.com/spreadsheets/d/e/2PACX-1vRZVHePaoezGmveXoNkXIzZnrWOPyj7CWDQMIpZFkiySklVPPWh1WpGO9QGYPQ86868taRJFfADH8Ow/pub?gid=528247398&single=true&output=csv";
const UPDATE_INTERVAL=30000, FULL_RELOAD_INTERVAL=4*60*60*1000, FETCH_TIMEOUT=15000, WATCHDOG_TIMEOUT=8*60*1000;
const STORAGE_KEY='ec_pano_middle_v5';
let slides=[],pending=[],idx=0,slideTimer=null,updating=false,lastChange=Date.now(),first=true;
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function norm(v){return String(v??'').trim().toLocaleLowerCase('tr-TR')}
function duration(v,d=15){const n=parseInt(v,10);return (Number.isFinite(n)?Math.min(Math.max(n,5),300):d)*1000}
function parseDate(v){if(!v)return null;const s=String(v).trim();let d=new Date(s);if(!isNaN(d))return d;const m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})(?:\s+(\d{1,2}):(\d{2}))?$/);return m?new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0)):null}
function active(r){if(['false','hayır','hayir','0','pasif','no'].includes(norm(r.Aktif||'true')))return false;const now=Date.now(),a=parseDate(r.Baslangic||r.Başlangıç),b=parseDate(r.Bitis||r.Bitiş);return !(a&&now<a.getTime())&&!(b&&now>b.getTime())}
function ordered(a){return [...a].sort((x,y)=>(parseInt(x.Sira,10)||9999)-(parseInt(y.Sira,10)||9999))}
function csvParse(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(q&&n==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(x=>x!==''))rows.push(row);row=[]}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}if(!rows.length)return[];const head=rows[0].map((h,i)=>(i===0?h.replace(/^\uFEFF/,''):h).trim());return rows.slice(1).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]??'').trim()]))) }
async function fetchCSV(url){const ctrl=new AbortController(),t=setTimeout(()=>ctrl.abort(),FETCH_TIMEOUT);try{const sep=url.includes('?')?'&':'?';const res=await fetch(url+sep+'cb='+Date.now(),{cache:'no-store',signal:ctrl.signal});if(!res.ok)throw Error('HTTP '+res.status);return csvParse(await res.text())}finally{clearTimeout(t)}}
function save(s){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({slides:s,time:Date.now()}))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}').slides||[]}catch(e){return[]}}
function yt(url){const m=String(url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([^#&?]{11})/);return m?m[1]:null}
function theme(c){c=norm(c);if(c==='acil')return['ACİL','#dc2626','!'];if(['başarı','basari'].includes(c))return['BAŞARI','#16a34a','★'];if(c==='etkinlik')return['ETKİNLİK','#7c3aed','●'];if(['sınav','sinav'].includes(c))return['SINAV','#ea580c','✓'];if(['kutlama','doğum günü','dogum gunu'].includes(c))return['KUTLAMA','#db2777','★'];return['DUYURU','#2563eb','i']}
function build(media,exams){const out=[],map={};exams.filter(active).forEach(r=>{const g=String(r.Sinif||r.Sınıf||'').trim();if(!g)return;const t=String(r.Tur||r.Tür||'Normal').trim(),k=g+'_'+t;(map[k]??={grade:g,tur:t,rows:[]}).rows.push(r)});Object.values(map).sort((a,b)=>(+a.grade||99)-(+b.grade||99)).forEach(g=>{const sor=norm(g.tur)==='sorumluluk';out.push({type:'exam',grade:g.grade,rows:ordered(g.rows),color:sor?'#dc2626':g.grade==='9'?'#0284c7':g.grade==='10'?'#ea580c':g.grade==='11'?'#059669':'#7c3aed',title:sor?'SORUMLULUK SINAVI':'SINAV PROGRAMI',duration:duration(g.rows[0]?.Sure,20)})});ordered(media.filter(active)).forEach(r=>{const t=norm(r.Tip);if(!t)return;if(['haber','yazi','yazı','duyuru'].includes(t)){out.push({type:'news',title:r.Baslik||r.Başlık||r.Link||'',text:r.Aciklama||r.Açıklama||'',category:r.Kategori||'Duyuru',duration:duration(r.Sure,15)});return}if(t==='html'){out.push({type:'custom',html:r.Aciklama||r.Açıklama||'',duration:duration(r.Sure,20)});return}if(!r.Link)return;let url=String(r.Link).trim(),kind=t;if(kind==='youtube'||url.includes('youtube.com')||url.includes('youtu.be')){url=yt(url);if(!url)return;kind='youtube'}out.push({type:'media',url,kind,duration:duration(r.Sure,15)})});return out}
async function update(){if(updating)return;updating=true;$('dot').className='';try{const [m,e]=await Promise.all([fetchCSV(CSV_MEDYA),fetchCSV(CSV_SINAVLAR)]);const n=build(m,e);if(!n.length)throw Error('Boş veri');save(n);if(first||!slides.length){slides=n;pending=[];idx=0;hideLoader();render(0);first=false}else pending=n;$('dot').className='online'}catch(e){console.error(e);$('dot').className='offline';if(!slides.length){const old=load();if(old.length){slides=old;idx=0;hideLoader();render(0);first=false}else{hideLoader();message('Veriler alınamadı','İnternet bağlantısını ve Google Sheets yayınını kontrol edin.')}}}finally{updating=false}}
function cols(n){return n<=1?1:n===2?2:n<=6?3:4}
function lesson(no,name){return name?`<div class="lesson"><div class="hour">${no}.<small>DERS</small></div><div class="subject">${esc(name)}</div></div>`:''}
function examHTML(s){const cards=s.rows.map(r=>{const ls=lesson(2,r.Ders2||r.Ders3)+lesson(4,r.Ders4||r.Ders5)+lesson(9,r.Ders9)||'<div class="subject">Ders bilgisi girilmemiş.</div>';return `<div class="day"><div class="day-head"><div class="date">${esc(r.Tarih||'')}</div><div class="dayname">${esc(r.Gun||r.Gün||'')}</div></div><div class="lessons">${ls}</div></div>`}).join('');return `<div class="exam-box"><div class="exam-title">${esc(s.grade)}. SINIF ${esc(s.title)}</div><div class="exam-grid" style="grid-template-columns:repeat(${cols(s.rows.length)},minmax(0,1fr))">${cards}</div></div>`}
function mediaError(el){el.innerHTML='<div class="message"><strong>İçerik görüntülenemedi</strong><span>Pano otomatik olarak sonraki slayda geçecektir.</span></div>'}
function render(i){if(!slides.length)return;idx=(i+slides.length)%slides.length;const s=slides[idx],el=document.createElement('section');el.className='slide';if(s.type==='news'){const [label,color,icon]=theme(s.category);el.classList.add('news');el.style.setProperty('--news',color);el.innerHTML=`<div class="news-grid"><div class="news-icon">${esc(icon)}</div><div><div class="badge">${esc(label)}</div><h1>${esc(s.title)}</h1><p>${esc(s.text)}</p></div></div>`}else if(s.type==='exam'){el.classList.add('exam');el.style.setProperty('--theme',s.color);el.innerHTML=examHTML(s)}else if(s.type==='custom'){el.classList.add('custom');el.innerHTML=`<div class="custom-inner">${s.html||''}</div>`}else{el.classList.add('media');if(s.kind==='youtube'){const id=encodeURIComponent(s.url);el.innerHTML=`<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1&controls=0&rel=0&playsinline=1&loop=1&playlist=${id}" allow="autoplay; encrypted-media" title="Pano videosu"></iframe>`}else if(s.kind.includes('video')){const v=document.createElement('video');v.src=s.url;v.autoplay=true;v.muted=true;v.loop=true;v.playsInline=true;v.preload='auto';v.onerror=()=>mediaError(el);el.appendChild(v);setTimeout(()=>v.play().catch(()=>{}),500)}else{const im=document.createElement('img');im.src=s.url;im.alt='Pano görseli';im.referrerPolicy='no-referrer';im.onerror=()=>mediaError(el);el.appendChild(im)}}$('stage').replaceChildren(el);requestAnimationFrame(()=>el.classList.add('active'));lastChange=Date.now();const p=$('progress');p.style.transition='none';p.style.width='0';void p.offsetWidth;setTimeout(()=>{p.style.transition=`width ${s.duration||10000}ms linear`;p.style.width='100%'},50);clearTimeout(slideTimer);slideTimer=setTimeout(next,s.duration||10000)}
function next(){if(!slides.length)return;if(idx+1>=slides.length){if(pending.length){slides=pending;pending=[];save(slides)}idx=0}else idx++;render(idx)}
function message(a,b){const el=document.createElement('section');el.className='slide active';el.innerHTML=`<div class="message"><strong>${esc(a)}</strong><span>${esc(b)}</span></div>`;$('stage').replaceChildren(el)}
function hideLoader(){$('loader').style.display='none'}
window.addEventListener('online',()=>update());window.addEventListener('offline',()=>$('dot').className='offline');document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')update()});
async function start(){const old=load();if(old.length){slides=old;hideLoader();render(0);first=false}await update();setInterval(update,UPDATE_INTERVAL);setTimeout(()=>location.reload(),FULL_RELOAD_INTERVAL);setInterval(()=>{if(document.visibilityState==='visible'&&Date.now()-lastChange>WATCHDOG_TIMEOUT)location.reload()},60000)}
window.addEventListener('load',start);setTimeout(()=>{if($('loader').style.display!=='none'){hideLoader();if(!slides.length)message('Sistem başlatılamadı','Bağlantıyı kontrol edin.')}},20000);
</script>
</body>
</html>
